version: '3'

# No dotenv: verification never loads application credentials.
tasks:
  default:
    desc: List local commands
    cmds: [task --list]
  check:
    desc: Check formatting, Go analysis, tooling and Compose configuration
    cmds: [python3 tools/local.py check]
  test:
    desc: Run Go integration, backup restore and browser tests
    cmds: [python3 tools/local.py test]
  test:siwc:
    desc: Verify ChatGPT OAuth, Responses, billing and owner controls with synthetic providers
    env: {GOWORK: 'off'}
    dir: apps/backend
    cmds: [go test -race ./internal/agent ./internal/integrations/... ./internal/config ./internal/desktopapi ./internal/orchestration ./cmd/openalbert]
  test:go:
    desc: Run race tests with embedded SQLite, Chromium and FFmpeg
    cmds: [python3 tools/local.py test:go]
  test:widgets:
    desc: Test Telegram widget transport, schedule actions and command routing with the race detector
    env: {GOWORK: 'off'}
    dir: apps/backend
    cmds:
      - go test -race ./internal/config ./internal/widgets ./internal/integrations ./internal/agent ./internal/orchestration ./internal/storage ./internal/browser
      - env CGO_ENABLED=0 go build -o /dev/null ./cmd/openalbert
  test:computer:
    desc: Build a disposable user-computer template and test the SSH adapter
    cmds: [python3 tools/local.py test:computer]
  test:backup:
    desc: Verify encrypted online SQLite S3 backup, retention and restore in disposable containers
    cmds: [python3 tools/local.py test:backup]
  test:backup:unit:
    desc: Run backup unit tests, including exclusion and encrypted restore, with the race detector
    env: {GOWORK: 'off'}
    cmds:
      - go -C shared/backup test -race ./...
      - go -C services/backup test -race ./...
  test:web:
    desc: Build docs and test docs/inspector keyboard flows with Playwright reports
    cmds: [python3 tools/local.py test:web]
  images:
    desc: Build and smoke-test all images for the Docker engine architecture
    cmds: [python3 tools/local.py images]
  verify:
    desc: Run all checks, tests, image builds and a fresh deployment/restart test
    cmds: [python3 tools/local.py verify]
  publish:
    desc: Verify server checks and publish AMD64/ARM64 images from clean master
    cmds: [python3 tools/local.py publish]
  reports:
    desc: Show the most recent local run summary
    cmds: [python3 tools/local.py reports]
