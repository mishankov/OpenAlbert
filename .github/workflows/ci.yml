name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    name: Workflow and Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate development and release deployments
        run: python3 deploy/check-compose.py

  go:
    name: Go tests, PostgreSQL, VictoriaLogs, Chromium and FFmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: openalbert
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: openalbert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openalbert -d openalbert_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      victorialogs:
        image: victoriametrics/victoria-logs:v1.53.0
        ports:
          - 19428:9428
    env:
      OPENALBERT_TEST_DATABASE_URL: postgres://openalbert:ci-only-password@127.0.0.1:5432/openalbert_test?sslmode=disable
      OPENALBERT_TEST_NO_SANDBOX: "true"
      OPENALBERT_TEST_VICTORIALOGS_URL: http://127.0.0.1:19428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "OPENALBERT_TEST_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          test -n "$(command -v google-chrome)"
      - name: Wait for VictoriaLogs
        run: curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:19428/health
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 10m ./...

  web:
    name: Documentation and inspector browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npx playwright install --with-deps chromium
        working-directory: docs
      - run: npm test
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - run: npm run test:browser
        working-directory: docs
      - name: Test inspector, including keyboard flows
        run: ./docs/node_modules/.bin/playwright test -c internal/inspector/playwright.config.mjs
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            docs/test-results
            internal/inspector/test-results
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch.name }})
    needs: [config, go, web]
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {name: amd64, runner: ubuntu-24.04}
          - {name: arm64, runner: ubuntu-24.04-arm}
        image:
          - {name: openalbert, file: Dockerfile, target: ""}
          - {name: stt, file: deploy/stt/Dockerfile, target: ""}
          - {name: log-gateway, file: deploy/logging.Dockerfile, target: ""}
          - {name: minio, file: deploy/minio.Dockerfile, target: minio}
          - {name: minio-init, file: deploy/minio.Dockerfile, target: minio-init}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch.name }}
          load: true
          tags: openalbert-ci:${{ matrix.image.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.image.name == 'minio-init'
        with:
          go-version-file: go.mod
      - name: Smoke test image
        env:
          COMPONENT: ${{ matrix.image.name }}
        run: bash deploy/smoke-image.sh "$COMPONENT" "openalbert-ci:$COMPONENT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          COMPONENT: ${{ matrix.image.name }}
          ARCH: ${{ matrix.arch.name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT:sha-$GITHUB_SHA-$ARCH"
          docker tag "openalbert-ci:$COMPONENT" "$image"
          docker push "$image"

  publish:
    name: Publish ${{ matrix.component }} manifest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [openalbert, stt, log-gateway, minio, minio-init]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 as one image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT"
          docker buildx imagetools create \
            --tag "$image:sha-$GITHUB_SHA" \
            --tag "$image:master" \
            "$image:sha-$GITHUB_SHA-amd64" \
            "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
