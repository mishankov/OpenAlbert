<svg id="prompt-context" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 636.5px; background-color: white;" viewBox="4 4 636.5 542" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-prompt-context" aria-labelledby="chart-title-prompt-context"><title id="chart-title-prompt-context">Сборка контекста</title><desc id="chart-desc-prompt-context">Базовые инструкции и сообщения подаются модели, а задачи, память, навыки и документы загружаются через инструменты.</desc><style>#prompt-context{font-family:Arial,sans-serif;font-size:16px;fill:#172033;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#prompt-context .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#prompt-context .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#prompt-context .error-icon{fill:#faf5eb;}#prompt-context .error-text{fill:#050a14;stroke:#050a14;}#prompt-context .edge-thickness-normal{stroke-width:1px;}#prompt-context .edge-thickness-thick{stroke-width:3.5px;}#prompt-context .edge-pattern-solid{stroke-dasharray:0;}#prompt-context .edge-thickness-invisible{stroke-width:0;fill:none;}#prompt-context .edge-pattern-dashed{stroke-dasharray:3;}#prompt-context .edge-pattern-dotted{stroke-dasharray:2;}#prompt-context .marker{fill:#64748b;stroke:#64748b;}#prompt-context .marker.cross{stroke:#64748b;}#prompt-context svg{font-family:Arial,sans-serif;font-size:16px;}#prompt-context p{margin:0;}#prompt-context .label{font-family:Arial,sans-serif;color:#172033;}#prompt-context .cluster-label text{fill:#050a14;}#prompt-context .cluster-label span{color:#050a14;}#prompt-context .cluster-label span p{background-color:transparent;}#prompt-context .label text,#prompt-context span{fil