# Copy to models.toml in the installation root. Configure your providers,
# defaults and role routes before starting the application.
# Route targets use "<provider>/<model_id>".
[routes]
chat = "openai/SET_MODEL_ID"
background = "openai/SET_MODEL_ID"
analysis = "openai/SET_MODEL_ID"
# Optional default model for ACP coding sessions (defaults to chat).
# coding = "openai/SET_MODEL_ID"

[providers.openai]
adapter = "openai_chat_completions"
base_url = "https://api.openai.com/v1"
api_key_env = "LLM_API_KEY"
discover_models = true
# Optional glob allowlist/denylist for GET /models discovery:
# include_models = ["gpt-5*", "claude-*"]
# exclude_models = ["*embedding*", "*audio*"]
default_capabilities = ["tools", "vision", "structured_output"]
default_context_window_tokens = 128000
default_max_output_tokens = 8192
default_timeout = "120s"

# To use an LLM Proxy, set base_url to "https://proxy.example.com/v1" and put
# the proxy client key in OPENALBERT_PROXY_KEY in models.env.
# [providers.openai.headers_env]
# "X-LLM-Proxy-Key" = "OPENALBERT_PROXY_KEY"

# Optional provider defaults. Enable only options supported by your endpoint.
# [providers.openai.default_options]
# reasoning_effort = "high"
# thinking = "enabled"
# include_reasoning_content = true # DeepSeek thinking/tool history
# session_header = "x-opencode-session" # OpenCode Go
# output_token_field = "max_completion_tokens" # default: max_tokens

# Optional per-model overrides (limits, options, pricing, display name):
# [models."openai/SET_MODEL_ID"]
# display_name = "My Model"
# context_window_tokens = 200000
# max_output_tokens = 16384
# supported_reasoning_efforts = ["low", "medium", "high"]
# [models."openai/SET_MODEL_ID".pricing]
# input_per_million = 0.0
# cached_input_per_million = 0.0
# output_per_million = 0.0

# Optional ChatGPT subscription provider (keep commented until configured).
# Use OPENAI_AUTH_MODE=profiles (default), then sign in with /chatgpt login
# in Telegram. All models under openai_chatgpt share one account.
# [providers.chatgpt]
# adapter = "openai_chatgpt"
# base_url = "https://proxy.example.com/v1" # Optional. Default: https://api.openai.com/v1.
# discover_models = true
# default_capabilities = ["tools", "vision", "structured_output"]
# default_context_window_tokens = 128000
# default_max_output_tokens = 8192 # LOCAL input reserve only; does not cap provider output.
# default_timeout = "120s"
#
# [providers.chatgpt.headers_env]
# "X-LLM-Proxy-Key" = "OPENALBERT_PROXY_KEY"
