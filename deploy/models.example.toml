# Copy to models.toml in the installation root. Set the actual model, its
# supported capabilities and limits before starting the application.
# Names such as everyday are arbitrary; several roles may use one profile.
[routes]
chat = "everyday"
background = "everyday"
analysis = "everyday"

[profiles.everyday]
adapter = "openai_chat_completions"
base_url = "https://api.openai.com/v1"
model = "SET_MODEL_ID"
api_key_env = "LLM_API_KEY"
capabilities = ["tools", "vision", "structured_output"]
context_window_tokens = 128000
max_output_tokens = 8192
timeout = "120s"

# To use LLM Proxy, change the base_url above to "https://proxy.example.com/v1"
# and put the proxy client key in OPENALBERT_PROXY_KEY in models.env.
# [profiles.everyday.headers_env]
# "X-LLM-Proxy-Key" = "OPENALBERT_PROXY_KEY"

# Optional provider settings. Enable only options supported by your endpoint.
# [profiles.everyday.options]
# reasoning_effort = "high"
# thinking = "enabled"
# include_reasoning_content = true # DeepSeek thinking/tool history
# session_header = "x-opencode-session" # OpenCode Go
# output_token_field = "max_completion_tokens" # default: max_tokens

# Optional estimates in USD per million tokens; specify all three prices.
# [profiles.everyday.pricing]
# input_per_million = 0.0
# cached_input_per_million = 0.0
# output_per_million = 0.0

# Optional ChatGPT subscription profile (keep commented until configured).
# Use OPENAI_AUTH_MODE=profiles (default), then sign in with /chatgpt login
# in Telegram. All subscription profiles share one account.
# To route chat/analysis here, EDIT their existing [routes] entries above:
# chat = "subscription"
# analysis = "subscription"
# Keep background = "everyday" for API billing; profiles mode never falls back.
# Set model to an available slug from /chatgpt models and verify capabilities/limits.
# [profiles.subscription]
# adapter = "openai_chatgpt"
# base_url = "https://proxy.example.com/v1" # Optional. Default: https://api.openai.com/v1.
# model = "SET_CHATGPT_MODEL_SLUG"
# capabilities = ["tools", "vision", "structured_output"]
# context_window_tokens = 128000
# max_output_tokens = 8192 # LOCAL input reserve only; does not cap provider output.
# timeout = "120s"
# To use another subscription model for analysis, add a separate profile and
# route analysis to it. Models are configured in TOML; restart after changes.

# To use LLM Proxy, enable base_url above and put the proxy client key in
# OPENALBERT_PROXY_KEY in models.env.
# [profiles.subscription.headers_env]
# "X-LLM-Proxy-Key" = "OPENALBERT_PROXY_KEY"
