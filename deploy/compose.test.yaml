services:
  go:
    build:
      context: .
      dockerfile: tools/testing/go.Dockerfile
    command: ["sh", "tools/testing/go-modules.sh", "test", "-mod=readonly", "-json", "-race", "-p", "1", "-count=1", "-timeout", "10m", "./..."]
