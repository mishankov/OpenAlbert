# Standalone deployment: published images only. Docker Compose >= 2.24.0.
# Set OPENALBERT_IMAGE_PREFIX and OPENALBERT_IMAGE_TAG in .env; see docs/deployment.md.
name: openalbert

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  backup:
    profiles: [backup]
    labels:
      compose_service: backup
    image: "${OPENALBERT_IMAGE_PREFIX:?Set OPENALBERT_IMAGE_PREFIX to ghcr.io/owner/repository}/backup:${OPENALBERT_IMAGE_TAG:?Set OPENALBERT_IMAGE_TAG to a published sha tag or master}"
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 5m
    environment:
      BACKUP_CONTAINER: "true"
    tmpfs:
      - /tmp
    volumes:
      - .:/installation:ro
      - ./data:/installation/data
      - ./backup-config:/etc/openalbert-backup:ro
      - ./backup-state:/installation/backup-state
      - ./backup-work:/var/lib/openalbert-backup
    logging: *logging

  stt:
    profiles: [local-stt]
    labels:
      compose_service: stt
    image: "${OPENALBERT_IMAGE_PREFIX:?Set OPENALBERT_IMAGE_PREFIX to ghcr.io/owner/repository}/stt:${OPENALBERT_IMAGE_TAG:?Set OPENALBERT_IMAGE_TAG to a published sha tag or master}"
    restart: unless-stopped
    init: true
    cpus: "${STT_CPUS:-2}"
    mem_limit: "${STT_MEMORY_LIMIT:-3g}"
    pids_limit: 128
    environment:
      STT_MODEL: "${STT_MODEL:-nemotron-3.5}"
      STT_API_KEY: "${STT_API_KEY:-}"
      STT_DOWNLOAD_MODEL: "${STT_DOWNLOAD_MODEL:-true}"
      OMP_NUM_THREADS: "${STT_THREADS:-2}"
    volumes:
      - ./stt-models:/models
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15m
    logging: *logging
    stop_grace_period: 20s

  tts:
    profiles: [local-tts]
    labels:
      compose_service: tts
    image: "${OPENALBERT_IMAGE_PREFIX:?Set OPENALBERT_IMAGE_PREFIX to ghcr.io/owner/repository}/tts:${OPENALBERT_IMAGE_TAG:?Set OPENALBERT_IMAGE_TAG to a published sha tag or master}"
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "${TTS_CPUS:-2}"
    mem_limit: "${TTS_MEMORY_LIMIT:-1g}"
    pids_limit: 128
    environment:
      TTS_API_KEY: "${TTS_API_KEY:-}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *logging

  openalbert:
    labels:
      compose_service: openalbert
    image: "${OPENALBERT_IMAGE_PREFIX:?Set OPENALBERT_IMAGE_PREFIX to ghcr.io/owner/repository}/openalbert:${OPENALBERT_IMAGE_TAG:?Set OPENALBERT_IMAGE_TAG to a published sha tag or master}"
    shm_size: 512mb
    restart: unless-stopped
    init: true
    depends_on:
      stt:
        condition: service_started
        required: false
    env_file:
      - path: ./models.env
        required: false
    environment:
      DATA_DIR: /data
      TELEGRAM_WIDGETS: "${TELEGRAM_WIDGETS:-auto}"
      TELEGRAM_BASE_URL: "${TELEGRAM_BASE_URL:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}"
      TELEGRAM_OWNER_USER_ID: "${TELEGRAM_OWNER_USER_ID:-}"
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS in .env}"
      TELEGRAM_ALLOWED_GROUP_IDS: "${TELEGRAM_ALLOWED_GROUP_IDS:-}"
      TELEGRAM_WORKSPACE_GROUP_ID: "${TELEGRAM_WORKSPACE_GROUP_ID:-}"
      TELEGRAM_ALLOW_BOT_MESSAGES: "${TELEGRAM_ALLOW_BOT_MESSAGES:-false}"
      OPENAI_AUTH_MODE: "${OPENAI_AUTH_MODE:-profiles}"
      OPENAI_TOKEN_STORE: /data/chatgpt/credentials.json
      OPENAI_SIWC_MODEL: "${OPENAI_SIWC_MODEL:-}"
      OPENAI_LANE_COOLDOWN: "${OPENAI_LANE_COOLDOWN:-15m}"
      LLM_CONFIG_FILE: /etc/openalbert/models.toml
      LLM_API_KEY: "${LLM_API_KEY:-}"
      STT_BASE_URL: "${STT_BASE_URL-http://stt:8080/v1}"
      STT_MODEL: "${STT_MODEL:-nemotron-3.5}"
      STT_API_KEY: "${STT_API_KEY:-}"
      STT_REVISION: "${STT_REVISION:-ea30d66d-q8-nemo2bdfb03b-ru-pcm16-v1}"
      TTS_BASE_URL: "${TTS_BASE_URL:-}"
      TTS_API_KEY: "${TTS_API_KEY:-}"
      TTS_MODEL: "${TTS_MODEL:-piper}"
      TTS_VOICE: "${TTS_VOICE:-ru_RU-dmitri-medium}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-}"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      EXA_SEARCH_URL: "${EXA_SEARCH_URL:-}"
      EXA_MONTHLY_BUDGET_USD: "${EXA_MONTHLY_BUDGET_USD:-10}"
      YANDEX_SEARCH_URL: "${YANDEX_SEARCH_URL:-}"
      YANDEX_API_KEY: "${YANDEX_API_KEY:-}"
      YANDEX_FOLDER_ID: "${YANDEX_FOLDER_ID:-}"
      KNOWLEDGE_DIR: /data/knowledge
      COMPUTER_SSH_ADDRESS: "${COMPUTER_SSH_ADDRESS:-}"
      COMPUTER_SSH_USER: "${COMPUTER_SSH_USER:-albert}"
      COMPUTER_SSH_PASSWORD: "${COMPUTER_SSH_PASSWORD:-}"
      COMPUTER_SSH_KEY_FILE: "${COMPUTER_SSH_KEY_FILE:-}"
      BROWSER_ENABLED: "${BROWSER_ENABLED:-true}"
      BROWSER_NO_SANDBOX: "${BROWSER_NO_SANDBOX:-true}"
      BROWSER_EXECUTABLE: "${BROWSER_EXECUTABLE:-}"
      SESSION_IDLE_TIMEOUT: "${SESSION_IDLE_TIMEOUT:-30m}"
      CODING_SESSION_STALE_TIMEOUT: "${CODING_SESSION_STALE_TIMEOUT:-24h}"
      MAX_AGENT_STEPS: "${MAX_AGENT_STEPS:-100}"
      TASK_MIN_INTERVAL: "${TASK_MIN_INTERVAL:-5m}"
      INITIATIVE_INTERVAL: "${INITIATIVE_INTERVAL:-30m}"
      MEMORY_CONSOLIDATION_INTERVAL: "${MEMORY_CONSOLIDATION_INTERVAL:-24h}"
      DESKTOP_API_TOKEN: "${DESKTOP_API_TOKEN:-}"
      HTTP_ADDR: ":8080"
      INSPECTOR_PUBLIC_URL: "${INSPECTOR_PUBLIC_URL:-http://localhost:8080/inspect/}"
      BACKUP_STATE_DIR: /data/backup-state
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - type: bind
        source: ${LLM_CONFIG_HOST_FILE:-./models.toml}
        target: /etc/openalbert/models.toml
        read_only: true
        bind:
          create_host_path: false
      - ./computer/client:/data/computer:ro
      - ./backup-state:/data/backup-state:ro
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 45s

networks:
  default: {}
